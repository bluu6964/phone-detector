name: android-test-app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-test-app/**'
      - '.github/workflows/android-test.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runners ship an Android SDK (ANDROID_HOME); the
      # setup-android action is incompatible with its cmdline-tools 16.0,
      # so install the needed packages with the preinstalled sdkmanager.
      - name: Install SDK platform 34 + build-tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "Using $SDKMANAGER (ANDROID_HOME=$ANDROID_HOME)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: android-test-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-detector-test-apk
          path: android-test-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release test-app-v1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-app-v1
          name: Phone Detector Test App v1
          files: android-test-app/app/build/outputs/apk/debug/app-debug.apk
